<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="TripCosmos.co - X-Agents | Premium AI Telephony, CRM & Multi-Source Lead Management App.">
  <meta name="google-signin-client_id" content="77399722057-6o97tf20jmhjaaid60gks1ajn5k1029s.apps.googleusercontent.com">

  <!-- Google Identity Services (GSI) for seamless Site Kit Google Auth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Clean old service workers and CacheStorage
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let r of regs) { r.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (let k of keys) { caches.delete(k); }
      });
    }

    window.tcProcessGoogleCredential = function(idToken) {
      if (!idToken) return;
      fetch('https://tripcosmos.co/wp-json/tc-agents/v1/mobile/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_token: idToken })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.ok && data.user) {
          if (data.token) localStorage.setItem('tc_mobile_token', data.token);
          localStorage.setItem('tc_auth_user', JSON.stringify(data.user));
          window.location.reload();
        } else {
          window.location.href = 'https://tripcosmos.co/wp-login.php?redirect_to=' + encodeURIComponent(window.location.origin + '/agents/');
        }
      })
      .catch(function() {
        window.location.href = 'https://tripcosmos.co/wp-login.php?redirect_to=' + encodeURIComponent(window.location.origin + '/agents/');
      });
    };

    window.tcInitGoogle = function() {
      try {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          const nonceArr = new Uint8Array(16);
          crypto.getRandomValues(nonceArr);
          const nonce = Array.from(nonceArr, b => b.toString(16).padStart(2, '0')).join('');
          document.cookie = 'googlesitekit_auth_nonce=' + nonce + ';max-age=900;path=/;SameSite=Lax';
          document.cookie = 'googlesitekit_auth_redirect_to=' + encodeURIComponent(window.location.origin + '/agents/') + ';max-age=300;path=/;SameSite=Lax';

          window.google.accounts.id.initialize({
            client_id: '77399722057-6o97tf20jmhjaaid60gks1ajn5k1029s.apps.googleusercontent.com',
            nonce: nonce,
            callback: function(response) {
              if (response && response.credential) {
                window.tcProcessGoogleCredential(response.credential);
              }
            }
          });
        }
      } catch(e) {
        console.warn('Google GSI init err:', e);
      }
    };

    window.tcLaunchGoogle = function() {
      try {
        if (window.google && window.google.accounts && window.google.accounts.id) {
          window.tcInitGoogle();
          window.google.accounts.id.prompt(function(notification) {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              window.location.href = 'https://tripcosmos.co/wp-login.php?redirect_to=' + encodeURIComponent(window.location.origin + '/agents/');
            }
          });
        } else {
          window.location.href = 'https://tripcosmos.co/wp-login.php?redirect_to=' + encodeURIComponent(window.location.origin + '/agents/');
        }
      } catch(e) {
        window.location.href = 'https://tripcosmos.co/wp-login.php?redirect_to=' + encodeURIComponent(window.location.origin + '/agents/');
      }
    };

    // Auto-initialize One Tap prompt like Claude and ChatGPT
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (typeof window.tcInitGoogle === 'function') {
          window.tcInitGoogle();
          try {
            if (window.google && window.google.accounts && window.google.accounts.id) {
              window.google.accounts.id.prompt();
            }
          } catch(_) {}
        }
      }, 800);
    });
  </script>

  <!-- iOS meta tags & icons -->

  <title>TripCosmos.co - X-Agents</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Bulletproof Native Web Audio Synthesizer for Notifications & Calls
    window.tcPlaySound = function(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = window._tcAudioCtx || (window._tcAudioCtx = new AudioCtx());
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'ringtone') {
          // Telephony cadence (440Hz standard dial/ring)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.start(now);
          osc.stop(now + 1.2);
        } else if (type === 'success') {
          // Melodic success chime (C5 -> E5 -> G5)
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        } else {
          // Notification alert chime / WhatsApp Bell (880Hz -> 1320Hz)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        console.warn('Audio synthesis error:', e);
      }
    };
  </script>
</head>
